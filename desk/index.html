<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>给口播配画面 · VisionBuddy</title>
  <link rel="stylesheet" href="/desk/style.css">
  <script src="/desk/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="width top-inner"><a class="brand" href="/desk/">VisionBuddy</a><nav class="top-links"><a href="/my-assets/">我的素材</a><a href="/visual/index.html">浏览素材册 ↗</a></nav></div>
  </header>
  <main class="width">
    <div class="title">
      <h1>给口播<span>配画面</span></h1>
      <p>从原句找到值得配图的地方，试看后把采用的画面一起带走。</p>
    </div>
    <details class="intake" id="intake" open>
      <summary>口播素材 <span id="source-summary"></span></summary>
      <div class="intake-body">
        <div class="mode" aria-label="选择口播来源">
          <button type="button" data-mode="script" aria-pressed="true">贴口播稿</button>
          <button type="button" data-mode="srt" aria-pressed="false">用 SRT 字幕</button>
          <button type="button" data-mode="video" aria-pressed="false">用已有视频</button>
        </div>
        <form id="intake-form">
          <div data-inputs="script">
            <label for="script">口播正文</label>
            <textarea id="script" maxlength="120000" rows="6" placeholder="粘贴口播稿。稿中已有的素材编号和「画面：无」会沿用。"></textarea>
          </div>
          <div data-inputs="srt" hidden>
            <label for="srt">SRT 字幕</label>
            <input id="srt" type="file" accept=".srt" aria-describedby="srt-tip">
            <p class="note" id="srt-tip">沿用字幕的起止时间码。</p>
          </div>
          <div data-inputs="video" hidden>
            <div class="inputs">
              <label>本机视频 <input id="video-file" type="file" accept="video/*,.mp4,.mov,.mkv,.webm"></label>
              <label>配套 SRT <span class="note">可选</span><input id="video-srt" type="file" accept=".srt"></label>
            </div>
            <div id="speech-options" class="inputs">
              <label>本机转写模型 <select id="model"><option value="">读取本机模型…</option></select></label>
              <label>口播语言 <select id="language"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">英文</option></select></label>
            </div>
            <button type="button" id="relink-video" hidden>把这份原片关联到审核工程</button>
            <p class="note" id="video-tip">优先使用配套 SRT。只有视频时，可用已安装的 Whisper 模型本机转写。</p>
          </div>
          <div class="actions intake-actions">
            <button class="primary" id="plan-button" type="submit">推荐画面</button>
            <button type="button" id="open-project">打开审核工程</button>
            <input type="file" id="project-file" accept=".json,.zip" hidden>
            <p id="intake-status" role="status"></p>
          </div>
        </form>
      </div>
    </details>

    <section id="review" hidden aria-label="画面审核">
      <div class="review-head">
        <div><h2>逐句试看</h2><p id="counts" aria-live="polite"></p></div>
        <div class="actions">
          <label class="inline"><input type="checkbox" id="show-plain"> 显示全部原句</label>
          <button type="button" id="save-project">保存审核工程</button>
        </div>
      </div>
      <p id="warnings" class="message" hidden></p>
      <div class="review-grid">
        <div class="lines" id="lines" aria-label="口播原句"></div>
        <article class="proof" id="proof" aria-label="所选原句的预览">
          <div class="proof-top">
            <p class="stamp" id="proof-time"></p>
            <h3 id="proof-quote">选择一句查看</h3>
            <p id="proof-reason"></p>
          </div>
          <div class="stage" id="stage" hidden>
            <video hidden id="player" controls playsinline preload="metadata"></video>
            <iframe id="overlay" title="透明画面小样" sandbox="allow-scripts" hidden></iframe>
          </div>
          <div class="proof-content">
            <div id="choices" class="choices" aria-label="画面版本"></div>
            <div class="placement" id="placement" hidden>
              <label>出现 <input type="number" min="0" step="0.001" id="clip-start" inputmode="decimal" aria-label="画面起始秒数"></label>
              <label>结束 <input type="number" min="0" step="0.001" id="clip-end" inputmode="decimal" aria-label="画面结束秒数"></label>
              <label>位置 <select id="side"><option value="right">右上</option><option value="left">左上</option></select></label>
              <label>宽度 <input type="range" id="scale" min="20" max="65" value="40" aria-label="画面宽度百分比"></label>
            </div>
            <div class="actions" id="review-actions" hidden>
              <button type="button" id="play">试看此句</button>
              <button type="button" class="primary" id="adopt">采用</button>
              <button type="button" id="alternate">换一版</button>
              <button type="button" id="skip">跳过</button>
            </div>
            <p id="review-status" role="status"></p>
          </div>
        </article>
      </div>
      <div class="export">
        <div><strong id="export-count">已采用 0 条</strong><p id="export-status" role="status">采用后可一起导出。</p></div>
        <label>格式
          <select id="export-media"><option value="mov">透明 MOV + PNG + 源件</option><option value="png">透明 PNG + 源件</option><option value="source">可编辑源件</option></select>
        </label>
        <button type="button" id="export" class="primary" disabled>导出已采用素材</button>
      </div>
    </section>
  </main>
</body>
</html>
